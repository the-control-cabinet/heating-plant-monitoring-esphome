<text x="20" y="175" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#c0392b">From junction box W points (3095Y 5-core):</text>
<text x="20" y="193" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#c0392b">A: IN1-IN3 (brown/black/grey) · B: IN4-IN6 · C: IN7-IN8 + spare</text>
<rect x="780" y="640" width="170" height="90" rx="6" fill="#fff" stroke="#e67e22" stroke-width="1.2"/>
<text x="865" y="660" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#e67e22">Logic header</text>
<text x="790" y="680" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#222">VCC → ESP 3V3 (1)</text>
<text x="790" y="696" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#222">GND → ESP GND bus</text>
<text x="790" y="712" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#222">IN1-8: Dupont → Wago</text>
<text x="1110" y="193" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#2471a3">To ESP32 (multicore):</text>
<rect x="20" y="770" width="1260" height="110" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="35" y="795" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#222">VCC must be 3.3 V (not 5 V): the outputs connect straight to ESP32 pins, pulled up to VCC when off. Verified: all eight inputs read 3.3 V idle.</text>
<text x="35" y="817" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#222">Each input LED lights only with 230 V on that channel. Mains side: brown/black/grey cores to L1-L8, each cable's blue to its neutral Wago; earth bonded.</text>
<text x="35" y="839" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#222">Isolate the heating circuit at its MCB/fused spur, lock off and prove dead before opening. Live inputs come from the heating junction box, not this box.</text>
<text x="35" y="861" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#222">Labels: channel numbers on the lid edge, the IN1-IN8 list on top (IN5 = DHW tank valve drive LEFT, IN6 = RIGHT).</text>
</svg>