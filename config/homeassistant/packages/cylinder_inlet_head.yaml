# Cylinder inlet pressures against the mains sensor (14 Nov 2026; recalibrated and restructured 16 Nov).
# The mains sensor (DFRobot SEN0257, 0-16 bar) is in the ground-floor utility room, downstream of the
# stopcock; the cylinders and their inlet transducers are in the second-floor control room.
#
# Expected pressure at the cylinders = mains - (height x 0.0981 bar/m + sensor tolerance correction)
#   Height: a helper in metres (measured precisely 5.87 m, 16 Nov 15:04; first tape figure 6.2 m). The bar figure is worked out here.
#   Sensor tolerance correction: the disagreement that height doesn't explain. The ESP32 ADC
#   (calibrated 16 Nov against a multimeter) and the mains sensor's zero (stopcock test) are proven,
#   and both inlet sensors were span-checked against the AstroAI L7 (zero, ~2.9 and ~4 bar), so it
#   points to the mains sensor's span reading ~0.18 bar low at ~3 bar. Helper set to -0.18 bar until a
#   span gain is fitted to the mains sensor in ESPHome (then set it to 0).
#   Both helpers have no "initial", so the values set are kept across restarts.
# "vs expected" = inlet minus expected: ~0 at a trough before a top-up step,
# positive while a cylinder holds its reheat expansion.

input_number:
  mains_sensor_height_above_cylinder_inlets:
    name: "Height: cylinder inlet sensors above mains sensor"
    min: 0
    max: 10
    step: 0.01
    mode: slider
    unit_of_measurement: "m"
    icon: mdi:arrow-expand-vertical
    # no "initial": the value you set is kept across restarts (set 5.87 once after installing)

  mains_sensor_tolerance_correction:
    name: "Mains vs inlet sensors: tolerance correction"
    min: -0.5
    max: 0.5
    step: 0.01
    mode: slider
    unit_of_measurement: "bar"
    icon: mdi:tune-variant
    # no "initial": set -0.18 once after installing; 0 once the mains span gain is in ESPHome

template:
  - sensor:
      - name: "Mains pressure expected at cylinders"
        unique_id: mains_pressure_expected_at_cylinders
        unit_of_measurement: "bar"
        device_class: pressure
        state_class: measurement
        icon: mdi:gauge
        availability: >
          {{ has_value('sensor.esp32_utility_room_mains_water_pressure_2')
             and states('input_number.mains_sensor_height_above_cylinder_inlets') | float(0) > 0 }}
        state: >
          {% set height_m = states('input_number.mains_sensor_height_above_cylinder_inlets') | float(0) %}
          {% set tolerance_correction_bar = states('input_number.mains_sensor_tolerance_correction') | float(0) %}
          {% set effective = height_m * 0.0981 + tolerance_correction_bar %}
          {{ (states('sensor.esp32_utility_room_mains_water_pressure_2') | float - effective) | round(2) }}
        attributes:
          height_offset_bar: >
            {{ (states('input_number.mains_sensor_height_above_cylinder_inlets') | float(0) * 0.0981) | round(3) }}
          effective_offset_bar: >
            {{ (states('input_number.mains_sensor_height_above_cylinder_inlets') | float(0) * 0.0981
                + states('input_number.mains_sensor_tolerance_correction') | float(0)) | round(3) }}

      - name: "Cylinder left inlet vs expected"
        unique_id: cylinder_left_inlet_vs_expected
        unit_of_measurement: "bar"
        state_class: measurement
        icon: mdi:delta
        availability: >
          {{ has_value('sensor.control_room_esp32_control_room_cylinder_left_inlet_pressure')
             and has_value('sensor.mains_pressure_expected_at_cylinders') }}
        state: >
          {{ (states('sensor.control_room_esp32_control_room_cylinder_left_inlet_pressure') | float
              - states('sensor.mains_pressure_expected_at_cylinders') | float) | round(2) }}

      - name: "Cylinder right inlet vs expected"
        unique_id: cylinder_right_inlet_vs_expected
        unit_of_measurement: "bar"
        state_class: measurement
        icon: mdi:delta
        availability: >
          {{ has_value('sensor.control_room_esp32_control_room_cylinder_right_inlet_pressure')
             and has_value('sensor.mains_pressure_expected_at_cylinders') }}
        state: >
          {{ (states('sensor.control_room_esp32_control_room_cylinder_right_inlet_pressure') | float
              - states('sensor.mains_pressure_expected_at_cylinders') | float) | round(2) }}
