# Estimated hot water available in each Centre Store 250 L cylinder,
# from the top (outlet NTC) and bottom (Evohome CS92 probe, lower pocket ~1/4 up).
# top_weight 0.4: bottom quarter at the bottom reading, linear gradient above it.
# An indicator, not an exact volume (see docs/14).

template:
  - sensor:
      - name: "Left Cylinder Hot Water Available"
        unique_id: dhw_left_hot_water_available_l40
        unit_of_measurement: "L"
        state_class: measurement
        icon: mdi:water-boiler
        availability: >
          {{ has_value('sensor.control_room_esp32_control_room_hot_water_cylinder_left_outlet_temperature')
             and has_value('sensor.dhw_07_045307_temperature') }}
        state: >
          {% set volume = 250 %}
          {% set t_cold = 12 %}
          {% set t_use = 40 %}
          {% set top_weight = 0.4 %}
          {% set t_top = states('sensor.control_room_esp32_control_room_hot_water_cylinder_left_outlet_temperature') | float %}
          {% set t_bottom = states('sensor.dhw_07_045307_temperature') | float %}
          {% set t_avg = top_weight * t_top + (1 - top_weight) * t_bottom %}
          {% set litres = volume * (t_avg - t_cold) / (t_use - t_cold) %}
          {{ [litres, 0] | max | round(0) }}
        attributes:
          average_temperature: >
            {% set top_weight = 0.4 %}
            {% set t_top = states('sensor.control_room_esp32_control_room_hot_water_cylinder_left_outlet_temperature') | float(0) %}
            {% set t_bottom = states('sensor.dhw_07_045307_temperature') | float(0) %}
            {{ (top_weight * t_top + (1 - top_weight) * t_bottom) | round(1) }}
          stratification_k: >
            {% set t_top = states('sensor.control_room_esp32_control_room_hot_water_cylinder_left_outlet_temperature') | float(0) %}
            {% set t_bottom = states('sensor.dhw_07_045307_temperature') | float(0) %}
            {{ (t_top - t_bottom) | round(1) }}

      - name: "Right Cylinder Hot Water Available"
        unique_id: dhw_right_hot_water_available_l40
        unit_of_measurement: "L"
        state_class: measurement
        icon: mdi:water-boiler
        availability: >
          {{ has_value('sensor.control_room_esp32_control_room_hot_water_cylinder_right_outlet_temperature')
             and has_value('sensor.dhw_07_040975_temperature') }}
        state: >
          {% set volume = 250 %}
          {% set t_cold = 12 %}
          {% set t_use = 40 %}
          {% set top_weight = 0.4 %}
          {% set t_top = states('sensor.control_room_esp32_control_room_hot_water_cylinder_right_outlet_temperature') | float %}
          {% set t_bottom = states('sensor.dhw_07_040975_temperature') | float %}
          {% set t_avg = top_weight * t_top + (1 - top_weight) * t_bottom %}
          {% set litres = volume * (t_avg - t_cold) / (t_use - t_cold) %}
          {{ [litres, 0] | max | round(0) }}
        attributes:
          average_temperature: >
            {% set top_weight = 0.4 %}
            {% set t_top = states('sensor.control_room_esp32_control_room_hot_water_cylinder_right_outlet_temperature') | float(0) %}
            {% set t_bottom = states('sensor.dhw_07_040975_temperature') | float(0) %}
            {{ (top_weight * t_top + (1 - top_weight) * t_bottom) | round(1) }}
          stratification_k: >
            {% set t_top = states('sensor.control_room_esp32_control_room_hot_water_cylinder_right_outlet_temperature') | float(0) %}
            {% set t_bottom = states('sensor.dhw_07_040975_temperature') | float(0) %}
            {{ (t_top - t_bottom) | round(1) }}

      - name: "Left Cylinder Hot Water Charge"
        unique_id: dhw_left_hot_water_charge_pct
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:battery-heart-variant
        availability: "{{ has_value('sensor.left_cylinder_hot_water_available') }}"
        state: >
          {% set full = 250 * (58 - 12) / (40 - 12) %}
          {{ [[(states('sensor.left_cylinder_hot_water_available') | float / full * 100), 0] | max, 100] | min | round(0) }}

      - name: "Right Cylinder Hot Water Charge"
        unique_id: dhw_right_hot_water_charge_pct
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:battery-heart-variant
        availability: "{{ has_value('sensor.right_cylinder_hot_water_available') }}"
        state: >
          {% set full = 250 * (58 - 12) / (40 - 12) %}
          {{ [[(states('sensor.right_cylinder_hot_water_available') | float / full * 100), 0] | max, 100] | min | round(0) }}
