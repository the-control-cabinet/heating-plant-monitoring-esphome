# Boiler state v3 and the opto demand inputs (18 Nov 2026).
# A relay row with the relay on but its opto input off is a fault; for a cylinder, IN3/IN4 on with
# IN5/IN6 off means its own stat or cut-out is holding the valve shut.
type: vertical-stack
cards:
  - type: entities
    title: Boiler (v3)
    entities:
      - entity: sensor.control_room_esp32_control_room_boiler_electrical_state
        name: State
      - entity: binary_sensor.control_room_esp32_control_room_boiler_burner_on
        name: Burner
      - entity: sensor.control_room_esp32_control_room_boiler_current
        name: Current
      - entity: sensor.control_room_esp32_control_room_boiler_flow_temperature
        name: Flow
      - entity: sensor.control_room_esp32_control_room_boiler_return_temperature
        name: Return
      - entity: sensor.control_room_esp32_control_room_boiler_dt_flow_return
        name: Flow − return
      - entity: sensor.control_room_esp32_control_room_boiler_last_burn_duration
        name: Last burn
      - entity: sensor.control_room_esp32_control_room_boiler_last_off_gap
        name: Last gap (≈120 s = anti-cycle)
      - entity: sensor.boiler_starts_today
        name: Starts today
      - entity: sensor.boiler_starts_last_hour
        name: Starts last hour
      - entity: sensor.boiler_firing_time_today
        name: Firing time today
      - entity: sensor.control_room_esp32_control_room_boiler_failed_ignitions
        name: Failed ignitions (total)
      - entity: binary_sensor.boiler_call_without_heat
        name: Called but flow cold
      - entity: binary_sensor.control_room_esp32_control_room_firing_without_call
        name: Firing without call
  - type: markdown
    title: Relays vs opto inputs
    content: |
      {% set on = '🟢' %}{% set off = '⚪' %}
      {% macro d(e) %}{{ on if is_state(e, 'on') else off }}{% endmacro %}
      {% set p = 'binary_sensor.control_room_esp32_control_room_opto_' %}
      | Circuit | Evohome relay | Relay out | Downstream | Boiler call |
      |---|:-:|:-:|:-:|:-:|
      | Radiators | {{ d('binary_sensor.bdr_13_258561_active') }} | {{ d(p ~ 'in8_radiator_relay') }} IN8 | — | {{ d(p ~ 'in1_boiler_call') }} IN1 |
      | UFH | {{ d('binary_sensor.bdr_13_039497_active') }} | {{ d(p ~ 'in7_ufh_relay') }} IN7 | — | {{ d(p ~ 'in1_boiler_call') }} IN1 |
      | Left cylinder | {{ d('binary_sensor.bdr_13_073145_active') }} | {{ d(p ~ 'in3_hw_relay_left') }} IN3 | {{ d(p ~ 'in5_cylinder_left_valve_drive') }} IN5 valve | {{ d(p ~ 'in1_boiler_call') }} IN1 |
      | Right cylinder | {{ d('binary_sensor.bdr_13_036609_active') }} | {{ d(p ~ 'in4_hw_relay_right') }} IN4 | {{ d(p ~ 'in6_cylinder_right_valve_drive') }} IN6 valve | {{ d(p ~ 'in1_boiler_call') }} IN1 |

      Hot water timer (IN2): {{ d(p ~ 'in2_hot_water_timer') }} {{ 'permanent ON' if is_state(p ~ 'in2_hot_water_timer','on') else '**OFF: hot water blocked**' }}
      Opto alerts: {{ states('input_boolean.alerts_opto_inputs') }}
