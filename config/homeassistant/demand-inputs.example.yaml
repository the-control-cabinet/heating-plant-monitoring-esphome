# HA: demand signals passed to the OpenTherm node (entity names are examples).
template:
  - binary_sensor:
      - name: "Heating Any Demand"
        unique_id: heating_any_demand
        delay_off: "00:01:00"      # filter BDR91 TPI pulses
        state: >
          {{ is_state('binary_sensor.radiator_heating_demand','on')
             or is_state('binary_sensor.underfloor_heating_demand','on')
             or is_state('binary_sensor.hot_water_cylinder_left_demand','on')
             or is_state('binary_sensor.hot_water_cylinder_right_demand','on') }}
  - sensor:
      - name: "Heating Zone Demand Max"
        unique_id: heating_zone_demand_max
        unit_of_measurement: "%"
        # max of the RAMSES zone heat-demand sensors (add your zone entities)
        state: >
          {{ [states('sensor.zone_1_heat_demand')|float(0),
              states('sensor.zone_2_heat_demand')|float(0)] | max }}
