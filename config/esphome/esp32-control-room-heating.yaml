text_sensor:
  # --- 23 Nov DIAGNOSTIC: which access point the board is on ---
  - platform: wifi_info
    bssid:
      name: "Control Room WiFi BSSID"
  # =========================================================
  # Boiler state v3 (17 Nov 2026). Ideal Logic+ S30, SCT013-015 clamp on the permanent live.
  # Checked against two videos of the boiler display (flame symbol) with the HA history:
  #   12:23-12:36 radiators only, light load: 4 short burns ending at 72-73 C, ~120 s anti-cycle
  #     waits with the pump running; 13:48-13:56 all zones calling: one steady burn at full fire.
  # Why current alone can't work: at light load the pump slows while the burner is lit, so "pump only,
  # burner off" (0.30-0.36 A) draws MORE than "burning at low fire" (0.14-0.24 A), and mid fire sits
  # in the same 0.28-0.40 A band as pump only. v2 read it back to front.
  # v3 rules (current = 5 s median; flow slope = change of the 2 s flow reading over 20 s):
  #   LIGHTS when the current jumps to >= 0.42 A from not lit (0.38 until 18 Nov) (fan pre-purge, matches the flame symbol
  #     to 1-2 s), or sits at 0.13-0.28 A while the flow rises faster than 0.08 C/s.
  #   GOES OUT (any of):
  #     - current < 0.13 A for 10 s (pump stopped);
  #     - current in 0.28-0.42 A and the flow falling faster than 0.12 C/s (not in the first 45 s),
  #       with flow - return already below 12 C: the end is dated back to when the current entered
  #       that band (flame-off -> pump-only step). The 12 C check was added 19 Nov 2026 after a false
  #       "lockout suspected" at 06:45: at 06:30 a cold return (52.9 -> 46.9 C) made the boiler
  #       modulate up to 0.37-0.41 A while the flow dipped, which this rule read as flame-out; the
  #       burner then fired on low fire until 06:49 unseen. Real outs on 19 Nov had a gap of
  #       5.7-9.1 C at the decision, both false ones 15.1-16.9 C (and still rising);
  #     - current in 0.28-0.42 A with flow - return < 4 C for 30 s (not in the first 60 s);
  #     - IN1 (boiler call) switching from on to off: no switched live, so the burner has stopped.
  #       Added 18 Nov 2026 after a false "Firing Without Call" at 21:22: the call ended mid-burn,
  #       the pump ran its 4 min overrun at 0.38 A with every valve shut, the still water kept the
  #       flow from falling and dT above 4 C, so v3 held "Burning" until the pump stopped. Only the
  #       on -> off change ends a burn, so a wiring fault where IN1 never comes on is still caught by
  #       the "Firing Without Call" check.
  #   NO RELIGHT BY A JUMP for 120 s after IN1 drops, unless the call returns (20 Nov 2026: the current
  #     median stayed above 0.42 A for a few seconds after the call ended and v3 "relit" 1 s later: six
  #     false ~50 s burns with no call and the flow falling).
  #   FAILED IGNITION: lit by a jump but no flow rise (> 0.05 C/s) within 120 s.
  # Replayed on 15-17 Nov: starts within 1-2 s, ends within 3-15 s of the video; anti-cycle gaps
  # 118-120 s. Pump running with the burner out: IN1 on = Anti-Cycle Wait, IN1 off = Pump Overrun.
  # =========================================================
  - platform: template
    name: "Boiler Electrical State"
    id: boiler_electrical_state
    update_interval: 1s
    lambda: |-
      if (!id(boiler_current_smooth).has_state())
        return {"Unknown"};
      const float IDLE_A = 0.13f;     // below: pump stopped
      const float LO_A = 0.28f;       // low fire below this
      const float HI_A = 0.42f;       // light-off jump at or above this (18 Nov: 0.38 -> 0.42, pump only reads 0.37-0.38 A at 2 turns)
      const float FULL_A = 0.45f;     // "High Fire" label
      const float RISE = 0.08f;       // C/s, light-off without a jump
      const float ROSE = 0.05f;       // C/s, proves the burner lit
      const float FALL = -0.12f;      // C/s, burner out while the pump runs
      const float DT_MIN = 4.0f;      // C, flow - return below this = no heat going in
      const float DT_OUT = 12.0f;     // C, flow-falling "out" only counts below this (19 Nov; see notes above)
      uint32_t now = millis();
      float a = id(boiler_current_smooth).state;

      // 20 s flow slope from a 1 s ring buffer (21 values)
      static float fb[21];
      static uint8_t fn = 0, fp = 0;
      bool fok = id(boiler_flow_temperature_fast).has_state() && !std::isnan(id(boiler_flow_temperature_fast).state);
      bool rok = id(boiler_return_temperature_fast).has_state() && !std::isnan(id(boiler_return_temperature_fast).state);
      float f = fok ? id(boiler_flow_temperature_fast).state : 0.0f;
      float slope = 0.0f;
      bool slope_ok = false;
      if (fok) {
        fb[fp] = f;
        fp = (fp + 1) % 21;
        if (fn < 21) fn++;
        if (fn == 21) { slope = (f - fb[fp]) / 20.0f; slope_ok = true; }
      }
      float dT = (fok && rok) ? f - id(boiler_return_temperature_fast).state : 99.0f;

      auto end_burn = [&](uint32_t end_t, bool failed) {
        if (end_t < id(b3_start)) end_t = id(b3_start);
        id(b3_lit) = false;
        if (failed) {
          id(b3_failed_total) += 1;
          id(boiler_failed_ignitions).publish_state((float) id(b3_failed_total));
        } else {
          id(boiler_last_burn).publish_state((end_t - id(b3_start)) / 1000.0f);
        }
        id(b3_last_end) = end_t;
        id(b3_mid_since) = 0;
        id(b3_low_since) = 0;
        id(b3_dtlow_since) = 0;
      };

      bool mid = (a >= LO_A && a < HI_A);
      if (mid) { if (id(b3_mid_since) == 0) id(b3_mid_since) = now; }
      else id(b3_mid_since) = 0;

      // IN1: the call dropping (on -> off) means the switched live has gone
      bool call_now = id(boiler_call_for_heat).state;
      bool call_dropped = id(b3_call_prev) && !call_now;
      id(b3_call_prev) = call_now;
      // 20 Nov: after the call drops, the 5 s current median stays high for a few seconds (fan post-purge /
      // the burner was at mid-high fire), which re-triggered "lights" 1 s after the IN1 end: 6 false ~50 s
      // burns on 20 Nov, all with no call and the flow falling. No switched live = no light-off by a jump
      // for 120 s after a call ends, unless a new call arrives. A wiring fault where IN1 never comes on is
      // still caught (no recent drop), and the flow-rise rule is unchanged.
      static uint32_t drop_t = 0;
      if (call_dropped) drop_t = now;
      bool just_dropped = (drop_t != 0 && now - drop_t < 120000);

      if (!id(b3_lit)) {
        bool spike = (a >= HI_A) && !(just_dropped && !call_now);
        bool quiet = (id(b3_last_end) == 0 || now - id(b3_last_end) > 40000);
        bool rise = (a >= IDLE_A && a < LO_A && slope_ok && slope > RISE && quiet);
        if (spike || rise) {
          id(b3_lit) = true;
          id(b3_by_spike) = spike;
          id(b3_rose) = !spike;
          id(b3_start) = now;
          id(b3_low_since) = 0;
          id(b3_dtlow_since) = 0;
          if (id(b3_last_end) > 0)
            id(boiler_last_gap).publish_state((now - id(b3_last_end)) / 1000.0f);
        }
      } else {
        uint32_t age = now - id(b3_start);
        if (slope_ok && slope > ROSE) id(b3_rose) = true;
        // call ended: no switched live, so the burner is out (not a failed ignition)
        if (call_dropped) end_burn(now, false);
        // pump stopped
        if (a < IDLE_A) {
          if (id(b3_low_since) == 0) id(b3_low_since) = now;
          if (now - id(b3_low_since) >= 10000) end_burn(id(b3_low_since), false);
        } else id(b3_low_since) = 0;
        // flame out, pump running: flow falling in the pump-only band, and the flow-return gap already
        // closing (a cold return arriving while the burner modulates up also drops the flow, but the
        // gap then stays at 15-20 C). If the return sensor is missing (dT = 99), the old rule applies.
        bool gap_closing = (dT >= 98.0f) || (dT < DT_OUT);
        if (id(b3_lit) && mid && slope_ok && slope < FALL && age > 45000 && gap_closing) {
          uint32_t e = (now - id(b3_mid_since) <= 60000) ? id(b3_mid_since) : now;
          end_burn(e, false);
        }
        // pump-only band with no heat going in
        if (id(b3_lit) && mid && dT < DT_MIN) {
          if (id(b3_dtlow_since) == 0) id(b3_dtlow_since) = now;
          if (now - id(b3_dtlow_since) >= 30000 && age > 60000) end_burn(id(b3_dtlow_since), false);
        } else id(b3_dtlow_since) = 0;
        // never lit
        if (id(b3_lit) && !id(b3_rose) && age > 120000) end_burn(now, true);
      }

      if (id(b3_lit)) {
        if (id(b3_by_spike) && now - id(b3_start) < 20000) return {"Burner Lighting"};
        if (a >= FULL_A) return {"Burning - High Fire"};
        if (a < LO_A) return {"Burning - Low Fire"};
        return {"Burning - Modulating"};
      }
      if (a < IDLE_A) return {"Off"};
      // Pump running, burner out: IN1 says whether the boiler is still being called.
      if (id(boiler_call_for_heat).state) return {"Pump Only - Anti-Cycle Wait"};
      return {"Pump Overrun"};

binary_sensor:
  - platform: status
    name: "Control Room Online"
 
  # =========================================================
  # Opto board: Hailege 8-ch AC 230 V optocoupler, logic link set to 3.3 V (docs/11).
  # Board outputs -> GPIO (internal pull-ups). Output LOW when 230 V present, so inverted: true
  # (confirmed on all 8 channels, 17 Nov 2026). Opto cable cores: A black IN1, grey IN2 (brown spare);
  # B black IN3, grey IN4, brown IN5; C black IN6, grey IN7, brown IN8.
  #   IN1 Boiler call (W7)              -> GPIO14
  #   IN2 Hot water timer output (W3)   -> GPIO18
  #   IN3 HW relay L output (W6)        -> GPIO15
  #   IN4 HW relay R output (W5)        -> GPIO16
  #   IN5 Cyl L valve drive (W2)        -> GPIO17
  #   IN6 Cyl R valve drive (W1)        -> GPIO11
  #   IN7 UFH relay / UF valve (W4)     -> GPIO12
  #   IN8 Radiator relay (W8)           -> GPIO42  (W8 built at Stage 1a, linked to W7; live now)
  # GPIO6 = boiler pressure; GPIO7 = held LOW as the filter ground for GPIO6's 10 uF (not spare).
  # Avoid GPIO19 (USB), 0/45/46, 35-37, 48.
  # =========================================================
  - platform: gpio
    pin:
      number: GPIO14
      mode: INPUT_PULLUP
      inverted: true
    name: "Opto IN1 Boiler Call"
    id: boiler_call_for_heat
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
  - platform: gpio
    pin:
      number: GPIO18
      mode: INPUT_PULLUP
      inverted: true
    name: "Opto IN2 Hot Water Timer"
    id: opto_in2_hw_timer
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
  - platform: gpio
    pin:
      number: GPIO15
      mode: INPUT_PULLUP
      inverted: true
    name: "Opto IN3 HW Relay Left"
    id: opto_in3_hw_relay_left
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
  - platform: gpio
    pin:
      number: GPIO16
      mode: INPUT_PULLUP
      inverted: true
    name: "Opto IN4 HW Relay Right"
    id: opto_in4_hw_relay_right
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
  - platform: gpio
    pin:
      number: GPIO17
      mode: INPUT_PULLUP
      inverted: true
    name: "Opto IN5 Cylinder Left Valve Drive"
    id: opto_in5_cyl_left_valve
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
  - platform: gpio
    pin:
      number: GPIO11
      mode: INPUT_PULLUP
      inverted: true
    name: "Opto IN6 Cylinder Right Valve Drive"
    id: opto_in6_cyl_right_valve
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
  - platform: gpio
    pin:
      number: GPIO12
      mode: INPUT_PULLUP
      inverted: true
    name: "Opto IN7 UFH Relay"
    id: opto_in7_ufh_relay
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
  - platform: gpio
    pin:
      number: GPIO42
      mode: INPUT_PULLUP
      inverted: true
    name: "Opto IN8 Radiator Relay"
    id: opto_in8_radiator_relay
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
 
  # Boiler state v3
  - platform: template
    name: "Boiler Burner On"
    id: boiler_burner_on
    device_class: heat
    lambda: |-
      return id(b3_lit);
  - platform: template
    name: "Firing Without Call"
    id: firing_without_call
    lambda: |-
      return id(b3_lit) && !id(boiler_call_for_heat).state;
    filters:
      # 18 Nov 2026: IN1 is read every loop, the boiler state once a second, so a call ending
      # mid-burn could show this for up to 1 s before v3 ends the burn. 5 s hides that blip.
      - delayed_on: 5s
 
  # Tundish sense pins (MOSFET drains): configured here for their pull-ups; the interval
  # lambda reads them directly within each plate pulse.
  - platform: gpio
    pin:
      number: GPIO39      # t1 = LEFT: plate B on IO38 -> MOSFET (gate IO40) -> drain GPIO39
      mode: INPUT_PULLUP
      inverted: true
    id: t1_sense
    internal: true
  - platform: gpio
    pin:
      number: GPIO20      # t2 = RIGHT: plate B on IO47 -> MOSFET (gate IO19) -> drain GPIO20
      mode: INPUT_PULLUP
      inverted: true
    id: t2_sense
    internal: true
 
  - platform: template
    name: "Tundish (Left) Wet"
    id: t1_wet
    device_class: moisture
  - platform: template
    name: "Tundish (Right) Wet"
    id: t2_wet
    device_class: moisture
  - platform: template
    name: "Tundish Any Wet"
    id: any_wet
    device_class: moisture
    lambda: |-
      return id(t1_wet).state || id(t2_wet).state;
  - platform: template
    name: "Tundish (Left) Running"
    id: t1_running
    device_class: running
  - platform: template
    name: "Tundish (Right) Running"
    id: t2_running
    device_class: running
  - platform: template
    name: "Tundish Any Running"
    id: any_running
    device_class: running
    lambda: |-
      return id(t1_running).state || id(t2_running).state;
 
button:
  - platform: template
    name: "Reset Tundish Wet Events"
    on_press:
      - lambda: |-
          id(t1_events) = 0;
          id(t2_events) = 0;
          id(t1_run_events) = 0;
          id(t2_run_events) = 0;
 
interval:
  - interval: 5s
    then:
      - if:
          condition:
            switch.is_off: tundish_test_mode
          then:
            - lambda: |-
                gpio_set_pull_mode(GPIO_NUM_47, GPIO_FLOATING);
                gpio_set_pull_mode(GPIO_NUM_38, GPIO_FLOATING);
            - switch.turn_on: plate_power
            - delay: 150ms
            # Reading 1: 2.2 MOhm only -> "wet". Sense pin LOW = MOSFET on.
            - lambda: |-
                id(t1_raw_wet) = (gpio_get_level(GPIO_NUM_39) == 0);   // LEFT
                id(t2_raw_wet) = (gpio_get_level(GPIO_NUM_20) == 0);   // RIGHT
                gpio_set_pull_mode(GPIO_NUM_47, GPIO_PULLDOWN_ONLY);
                gpio_set_pull_mode(GPIO_NUM_38, GPIO_PULLDOWN_ONLY);
            - delay: 20ms
            # Reading 2: with the internal pull-downs -> "running"
            - lambda: |-
                bool t1_run_raw = (gpio_get_level(GPIO_NUM_39) == 0);  // LEFT
                bool t2_run_raw = (gpio_get_level(GPIO_NUM_20) == 0);  // RIGHT
                gpio_set_pull_mode(GPIO_NUM_47, GPIO_FLOATING);
                gpio_set_pull_mode(GPIO_NUM_38, GPIO_FLOATING);
 
                if (id(t1_raw_wet)) { id(t1_streak)++; } else { id(t1_streak) = 0; }
                bool wet1 = id(t1_streak) >= 2;
                if (wet1 && !id(t1_wet).state) { id(t1_events)++; }
                id(t1_wet).publish_state(wet1);
 
                if (id(t2_raw_wet)) { id(t2_streak)++; } else { id(t2_streak) = 0; }
                bool wet2 = id(t2_streak) >= 2;
                if (wet2 && !id(t2_wet).state) { id(t2_events)++; }
                id(t2_wet).publish_state(wet2);
 
                if (t1_run_raw) { id(t1_run_streak)++; } else { id(t1_run_streak) = 0; }
                bool run1 = id(t1_run_streak) >= 2;
                if (run1 && !id(t1_running).state) { id(t1_run_events)++; }
                id(t1_running).publish_state(run1);
 
                if (t2_run_raw) { id(t2_run_streak)++; } else { id(t2_run_streak) = 0; }
                bool run2 = id(t2_run_streak) >= 2;
                if (run2 && !id(t2_running).state) { id(t2_run_events)++; }
                id(t2_running).publish_state(run2);
            - if:
                condition:
                  switch.is_off: tundish_test_mode
                then:
                  - switch.turn_off: plate_power
 