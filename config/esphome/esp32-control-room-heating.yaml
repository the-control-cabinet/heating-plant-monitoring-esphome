# 24 Nov 2026 DIAGNOSTIC (temporary, flagged): water hammer check on both cylinder inlets.
#   The normal inlet sensors sample once a second and then median(7) + average(5), so a hammer spike
#   (tens of ms) is invisible on them. Added, nothing else changed: a second ADC read of GPIO1/GPIO2
#   every 20 ms, max over 2 s, published as "Cylinder Left/Right Inlet Pressure Peak (diag)".
#   Both pins now carry allow_other_uses: true (needed for two ADC sensors on one pin).
#   Remove once the hammer test is done: the two "Peak (diag)" sensors and the allow_other_uses lines.
# 23 Nov 2026 22:40 (one change): wifi power_save_mode: none. 19:59-22:28 on the diagnostic build: 4 API drops,
#   0 Wi-Fi drops, loop time 2-3 ms before each drop (no stall), same BSSID.
# 23 Nov 2026 DIAGNOSTIC (temporary, flagged): why the board's HA connection drops for 1-2 s about hourly.
#   HA's debug log showed the ESP closing the connection (EOF) after ~9 s of near-silent traffic; the router
#   logged nothing, and the HA device-log subscription forwarded nothing. Added, nothing else changed:
#     - Wi-Fi disconnect counter (on_disconnect) -> did the board lose its Wi-Fi link?
#     - API disconnect counter (on_client_disconnected) -> confirms each drop seen in HA
#     - debug loop_time -> a stalled main loop (several seconds) would show here
#     - wifi_info BSSID -> which access point it is on, and whether that changes
#   Read: API +1 with Wi-Fi +0 = link stayed up (socket/keepalive or a loop stall: check Loop Time);
#         API +1 with Wi-Fi +1 = the Wi-Fi link dropped (radio/AP side).
#   Remove this block once explained (globals diag_*, api on_client_disconnected, wifi on_disconnect,
#   debug + its sensors, the two template sensors, wifi_info).
# =============================================================================
# esp32-control-room-heating.yaml - boiler plant monitoring (10 Nov 2026: off-board rewiring)
# 20 Nov 2026: no relight by a current jump for 120 s after the boiler call (IN1) drops, unless the
#   call returns: six false ~50 s burns on 20 Nov came 1 s after a call ended (see the v3 notes).
# 19 Nov 2026: the flow-falling "burner out" rule now also needs flow - return below 12 C. A cold
#   return at 06:30 made the boiler modulate up while the flow dipped; v3 called it out and missed
#   18 min of low fire, giving a false "lockout suspected" (see the text_sensor notes).
# 18 Nov 2026 (evening): v3 ends a burn the moment IN1 (boiler call) switches off. A call ending
#   mid-burn at 21:22 gave a false "Firing Without Call": the 4 min pump overrun with every valve shut
#   kept v3 saying "Burning" until the pump stopped (see the text_sensor notes).
# 18 Nov 2026: light-off threshold 0.38 -> 0.42 A. With 2 clamp turns, pump only reads 0.375-0.384 A
#   (was 0.34-0.36 at 1 turn), which sat on the old threshold and gave false "Burner Lighting" during
#   anti-cycle waits; light-off jumps are 0.43-0.53 A. Replayed on 18 Nov 00:00-08:38: no false burns.
# 17 Nov 2026 (late): v3 uses opto IN1 (boiler call) to split "pump only" into "Anti-Cycle Wait" (call on,
#   burner out) and "Pump Overrun" (call off). Opto board commissioned; comments updated.
# 17 Nov 2026 (evening): clamp now 2 turns of the boiler permanent live -> multiply 15.0 -> 7.5, so the
#   amps (and the v3 thresholds) read the same as before with 2x the signal over the noise.
# 17 Nov 2026: boiler state v3 (burner on/off from the clamp current AND the flow temperature, checked
#   against two videos of the boiler display; see the text_sensor notes). v2 read the boiler back to front.
#   Flow, return and delta T now sent to HA on a 0.5 C change or every 30 s (were every 2 s); the logic
#   still uses the 2 s readings internally. Debug component and heap/loop sensors removed.
# 15 Nov 2026: boiler electrical state v2 (superseded by v3).
# ESP32-S3-DevKitC-1 (16 MB), ESPHome, ESP-IDF
#   - Boiler flow/return NTCs: installed, 3.3k dividers (docs/02)
#   - Boiler pressure: installed, calibrated to the boiler gauge, fast + 1-min main (docs/04)
#   - Cylinder outlet NTCs: left installed, right wired (docs/05)
#   - Tundish plates: commissioned, wet + running two-sensitivity sensing (docs/05)
#   - Current clamp (GPIO3): on the boiler permanent live (marker 33), 2 turns (17 Nov 2026), multiply 7.5
#   - Pressure gauges (10 Nov 2026 rewire): dividers (10k/20k) + 100 nF now in each GAUGE's junction
#     box; signal cores land directly on: boiler GPIO6, left cylinder GPIO1, right cylinder GPIO2
#     (left/right swapped 11 Nov to match the fitted gauges; header corrected 18 Nov).
#     5 V / GND via the bus strip (470 uF across the buses to be added).
#   - Off-board NTC wiring: IO4/IO5 3.3k to 3V3 pins; IO8/IO9 3.3k to IO10, a 3V3 POST (keep IO10
#     out of this YAML). IO13 stays the current clamp's post.
#   - Tundish plates re-terminated 10 Nov: LEFT plate B on IO38 (sense GPIO39), RIGHT plate B on IO47
#     (sense GPIO20), so the pins below are swapped vs 5 Nov. Confirm with a water test.
#   - Opto board, 8 inputs (IN1-IN8): wired at the junction-box Stage 1a rewire and commissioned
#     17 Nov 2026 (each input proven on and off against its relay; polarity inverted: true correct)
# =============================================================================
substitutions:
  # Boiler pressure transducer: generic G1/4" 0-80 PSI, 0.5-4.5 V, ratiometric (assumed)
  pressure_full_scale_bar: "5.516"    # 80 PSI
  pressure_supply_v: "4.69"           # measured at the sensor's red wire (ESP32 5V pin)
  pressure_divider_ratio: "0.664"     # measured: GPIO1 0.760 V / sensor 1.145 V
  # Cylinder cold-inlet transducers: Ausla 0-150 PSI (10.342 bar), 0.5-4.5 V, 5 V ratiometric.
  # Divider 10k/20k (in each gauge's box): nominal ratio 0.667 until measured (pin V / sensor V).
  # Zero: the sensor's output at ROOM pressure, normalised to 5 V. Nominal 0.5 V; replace with
  # "Inlet (Left/Right) Sensor Voltage Normalised" read at room pressure before the plumber fits them.
  inlet_full_scale_bar: "10.342"
  inlet_left_divider_ratio: "0.667"
  inlet_right_divider_ratio: "0.667"
  inlet_left_zero_v: "0.482"     # 11 Nov 2026: mean of 1.5 h at room pressure, measured on GPIO1 (now LEFT)
  # Revisit both zeros once the 470 uF is fitted across the 5 V and GND buses.
  inlet_right_zero_v: "0.487"    # 11 Nov 2026: mean of 1.5 h at room pressure, measured on GPIO2 (now RIGHT)
  # Span checks 12 Nov 2026 (tyre gauge on each vessel's Schrader valve, water above the pre-charge):
  #   right: HA 4.06 vs gauge 4.10 bar (agrees); left: HA 3.59/3.65/3.70/3.72/3.74/3.79 vs gauge 3.70/3.75/3.80/3.85/3.85/3.85 bar (mean ratio 1.028,
  #   six points, gauge in 0.05 bar steps; unchanged by re-seating the box; resistor or sensor tolerance). Zero unaffected.
  # 13 Nov 2026: one clean-signal check after the IO1 noise fix: HA 3.59 (with 1.028) vs gauge 3.55 bar
  # (suggests ~1.017); kept at 1.028 until more clean readings are taken.
  inlet_left_span_gain: "1.028"
  inlet_right_span_gain: "1.000"
 
esphome:
  name: esp32-control-room-heating
  friendly_name: Control Room (Heating)
  on_boot:
    priority: 600
    then:
      - lambda: |-
          // Tundish gate posts: inputs, no internal pull, until each "running" sample
          gpio_set_direction(GPIO_NUM_47, GPIO_MODE_INPUT);
          gpio_set_pull_mode(GPIO_NUM_47, GPIO_FLOATING);
          gpio_set_direction(GPIO_NUM_38, GPIO_MODE_INPUT);
          gpio_set_pull_mode(GPIO_NUM_38, GPIO_FLOATING);
          // IO40 (JTAG MTDO pad, linked to the right MOSFET's gate): explicitly input, no pull
          gpio_set_direction(GPIO_NUM_40, GPIO_MODE_INPUT);
          gpio_set_pull_mode(GPIO_NUM_40, GPIO_FLOATING);
 
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
 
logger:
