# =========================================================
# Tundish drip sensors — gold-plated contact plates + 2N7000 MOSFETs (as-built 5 Nov 2026)
# Plate power (both plates, shared): GPIO21, pulsed 150 ms every 5 s.
# 10 Nov 2026 re-termination (plates swapped vs 5 Nov):
# t1 = LEFT:  plate B on post IO38 (+ link to IO40, 2.2 MOhm to GND); 2N7000 S -> IO41 (-> GND),
#             G -> IO40, D -> GPIO39
# t2 = RIGHT: plate B on post IO47 (+ gate wire to IO19, 2.2 MOhm to GND); 2N7000 S -> GND,
#             G -> IO19, D -> GPIO20
# GPIO20 is also native USB D+: use only the board's UART ("COM") port.
# Two-sensitivity sensing: reading 1 (2.2 MOhm) = wet; reading 2 with the gate posts'
# internal ~45 kOhm pull-downs = running. Posts are only ever inputs.
# Test switches (OFF after reboot, and auto-off after 15 min so they can't be left on):
#   Test Mode: plate power held on, sampling paused (both tundishes).
#   Test Pull-down: gate posts' internal pull-downs on demand.
# Commissioning 6 Nov 2026 (meter 10 MOhm, DC):
#   Right IO38 dry 906 mV -> drain-low test showed drain-to-gate leakage -> new 2N7000
#     328 mV -> IPA clean of terminals 38-41 -> 30 mV (3 mV fully dry). Wet flowing 3.1-3.2 V;
#     pull-down on 2.2 V (running).
#   Left IO47 dry 0.3-0.4 V: board ruled out (ferrule out of IO47 401 mV; drain low with
#     IO20 verified 0 V no change; IO48/IO21 0 V; new 2N7000; MOSFET removed 415 mV), so
#     source is the cable/plate side (likely a small galvanic/leakage voltage). Within
#     margin (switching ~2 V). Wet flowing ~3.05-3.3 V; pull-down on 2.6 V flowing,
#     1.8 V drying. Record baselines at each periodic plate clean.
#   Wet = drips (relief valve weeping, warning); Running = sustained flow (discharge, critical).
# Posts on this board (never use elsewhere): IO2, IO13, IO41; IO38/IO40/IO47 lambdas only.
# =========================================================
switch:
  - platform: gpio
    pin: GPIO21
    id: plate_power
    internal: true
    restore_mode: ALWAYS_OFF

  # GPIO7 held LOW from boot: the ground point for the 10 uF filter across the adjacent header pins
  # GPIO6 (boiler pressure) and GPIO7 (16 Nov 2026; no GND pin near GPIO6 and no room in the gauge
  # box Wagos). No steady current flows, so the pressure reading is unaffected. Do not use GPIO7
  # for anything else while the capacitor is fitted.
  - platform: gpio
    pin: GPIO7
    id: gpio7_filter_ground
    internal: true
    restore_mode: ALWAYS_OFF
 
  - platform: template
    name: "Tundish Test Mode"
    id: tundish_test_mode
    entity_category: config
    icon: mdi:test-tube
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - switch.turn_on: plate_power
      - script.execute: tundish_test_mode_timer
    turn_off_action:
      - script.stop: tundish_test_mode_timer
      - switch.turn_off: tundish_test_pulldown
      - switch.turn_off: plate_power
 
  - platform: template
    name: "Tundish Test Pull-down"
    id: tundish_test_pulldown
    entity_category: config
    icon: mdi:arrow-down-bold-box-outline
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: |-
          gpio_set_pull_mode(GPIO_NUM_47, GPIO_PULLDOWN_ONLY);
          gpio_set_pull_mode(GPIO_NUM_38, GPIO_PULLDOWN_ONLY);
      - script.execute: tundish_test_pulldown_timer
    turn_off_action:
      - script.stop: tundish_test_pulldown_timer
      - lambda: |-
          gpio_set_pull_mode(GPIO_NUM_47, GPIO_FLOATING);
          gpio_set_pull_mode(GPIO_NUM_38, GPIO_FLOATING);
 
# Auto-off for the tundish test switches (15 min); restart mode re-arms on each switch-on
script:
  - id: tundish_test_mode_timer
    mode: restart
    then:
      - delay: 15min
      - switch.turn_off: tundish_test_mode
  - id: tundish_test_pulldown_timer
    mode: restart
    then:
      - delay: 15min
      - switch.turn_off: tundish_test_pulldown
 
# 23 Nov DIAGNOSTIC: main-loop timing (a stall shows as a large max loop time)
debug:
  update_interval: 10s

sensor:
  # --- 23 Nov DIAGNOSTIC (remove when the connection drops are explained) ---
  - platform: debug
    loop_time:
      name: "Control Room Loop Time"
  - platform: template
    name: "Control Room WiFi Disconnects"
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 30s
    lambda: 'return id(diag_wifi_drops);'
  - platform: template
    name: "Control Room API Disconnects"
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 30s
    lambda: 'return id(diag_api_drops);'
  # Flow / return NTCs (beta 3977): 3V3 -> 3.3k -> IO4 (flow) / IO5 (return) -> NTC -> GND
  # (swapped 10 Nov 2026 to match the off-board re-wiring: flow now GPIO4, return GPIO5)
  # (330k found fitted by mistake and replaced, 3 Nov 2026; IO4/IO5 swapped in YAML to match)
  - platform: adc
    pin: GPIO4
    id: boiler_flow_adc
    attenuation: 12db
    samples: 16
    update_interval: 2s
 
  - platform: resistance
    id: boiler_flow_ohm
    sensor: boiler_flow_adc
    configuration: DOWNSTREAM
    resistor: 3.3kOhm
 
  # Fast (2 s) reading: internal, used by the state logic and delta T. HA gets the throttled copy below.
  - platform: ntc
    sensor: boiler_flow_ohm
    id: boiler_flow_temperature_fast
    internal: true
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    calibration:
      b_constant: 3977
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    filters:
      - median:
          window_size: 3
          send_every: 1
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1
 
  - platform: adc
    pin: GPIO5
    id: boiler_return_adc
    attenuation: 12db
    samples: 16
    update_interval: 2s
 
  - platform: resistance
    id: boiler_return_ohm
    sensor: boiler_return_adc
    configuration: DOWNSTREAM
    resistor: 3.3kOhm
 
  - platform: ntc
    sensor: boiler_return_ohm
    id: boiler_return_temperature_fast
    internal: true
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    calibration:
      b_constant: 3977
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    filters:
      - median:
          window_size: 3
          send_every: 1
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1
 
  # To HA (same names, so the entity IDs are unchanged): sent on a 0.5 C change or at least every 30 s.
  - platform: copy
    source_id: boiler_flow_temperature_fast
    name: "Boiler Flow Temperature"
    id: boiler_flow_temperature
    filters:
      - or:
          - throttle: 30s
          - delta: 0.5

  - platform: copy
    source_id: boiler_return_temperature_fast
    name: "Boiler Return Temperature"
    id: boiler_return_temperature
    filters:
      - or:
          - throttle: 30s
          - delta: 0.5

  - platform: template
    name: "Boiler ΔT (Flow − Return)"
    id: boiler_delta_t
    unit_of_measurement: "K"
    accuracy_decimals: 1
    update_interval: 2s
    lambda: |-
      if (!id(boiler_flow_temperature_fast).has_state() || !id(boiler_return_temperature_fast).has_state())
        return {};
      return id(boiler_flow_temperature_fast).state - id(boiler_return_temperature_fast).state;
    filters:
      - or:
          - throttle: 30s
          - delta: 0.5
 
  # Cylinder hot-outlet NTCs: 3.3k from the IO10 post -> IO9 (LEFT) / IO8 (RIGHT) -> NTC -> GND
  # Swapped 11 Nov 2026: a kitchen (left cylinder) draw dipped the left inlet and warmed the IO8 NTC.
  - platform: adc
    pin: GPIO9
    id: cyl_left_outlet_adc
    attenuation: 12db
    samples: 16
    update_interval: 5s
 
  - platform: resistance
    id: cyl_left_outlet_ohm
    sensor: cyl_left_outlet_adc
    configuration: DOWNSTREAM
    resistor: 3.3kOhm
 
  - platform: ntc
    sensor: cyl_left_outlet_ohm
    name: "Hot Water Cylinder (Left) Outlet Temperature"
    id: cyl_left_outlet_temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    calibration:
      b_constant: 3977
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    filters:
      - median:
          window_size: 3
          send_every: 1
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1
 
  - platform: adc
    pin: GPIO8
    id: cyl_right_outlet_adc
    attenuation: 12db
    samples: 16
    update_interval: 5s
 
  - platform: resistance
    id: cyl_right_outlet_ohm
    sensor: cyl_right_outlet_adc
    configuration: DOWNSTREAM
    resistor: 3.3kOhm
 
  - platform: ntc
    sensor: cyl_right_outlet_ohm
    name: "Hot Water Cylinder (Right) Outlet Temperature"
    id: cyl_right_outlet_temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    calibration:
      b_constant: 3977
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    filters:
      - median:
          window_size: 3
          send_every: 1
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1
 
  # Boiler current clamp — SCT013-015 (15A = 1V RMS): 3V3 -> 10k -> IO3 -> 10k -> GND bias,
  # capacitor + on IO3, - on post IO13; clamp tip -> IO13, sleeve -> GND
  - platform: adc
    pin: GPIO3
    id: boiler_adc
    attenuation: 12db
    update_interval: never
    internal: true
 
  - platform: ct_clamp
    sensor: boiler_adc
    name: "Boiler Current"
    id: boiler_current
    sample_duration: 1000ms
    update_interval: 1s
    accuracy_decimals: 2
    filters:
      - multiply: 7.5    # 17 Nov 2026: boiler permanent live (marker 33) passes 2 times through the clamp: 15 A / 2 turns. No known-load calibration (nominal).

  # Smoothed copy (5 s median) used only by the state logic: removes 1-4 s noise blips.
  # Current bands seen on the two videos (17 Nov 2026): standby ~0 A (0.08-0.12 A at times);
  #   pump only, burner off: 0.30-0.36 A; burning at low fire: 0.14-0.24 A (the pump slows);
  #   mid fire: 0.28-0.40 A; full fire: 0.57-0.60 A; fan pre-purge at light-off: 0.42-0.47 A for ~10 s.
  - platform: copy
    source_id: boiler_current
    id: boiler_current_smooth
    internal: true
    filters:
      - median:
          window_size: 5
          send_every: 1
 
  # Boiler pressure (10 Nov 2026): divider 10k/20k + 100 nF now in the boiler gauge's junction box;
  # its signal core lands on GPIO6. ADC calibration below was measured on GPIO1: re-check on GPIO6.
  # ADC calibrated against a meter; pressure calibrated to the boiler gauge (3 points, 3-4 Nov):
  # gauge = 1.193 x HA - 0.093 (valid 1.0-1.65 bar). Fast (diagnostic) + 1-min main sensor.
  # Cable screen to GND at the ESP32 end (5 Nov). 10 uF at the pin: + GPIO6, - GPIO7 (held LOW, see
  # switch "gpio7_filter_ground"), fitted 16 Nov; 100 nF stays in the gauge box.
  - platform: adc
    pin: GPIO6
    id: boiler_system_pressure_raw
    name: "Boiler Pressure Pin Voltage"
    entity_category: diagnostic
    unit_of_measurement: "V"
    accuracy_decimals: 3
    attenuation: 12db
    samples: 16
    update_interval: 1s
    filters:
      - median:
          window_size: 7
          send_every: 1
      - calibrate_linear:
          - 0.746 -> 0.760
          - 0.952 -> 0.958
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
 
  - platform: template
    name: "Boiler Pressure Sensor Voltage"
    id: boiler_pressure_sensor_voltage
    entity_category: diagnostic
    unit_of_measurement: "V"
    accuracy_decimals: 3
    update_interval: 10s
    lambda: |-
      if (!id(boiler_system_pressure_raw).has_state())
        return {};
      return id(boiler_system_pressure_raw).state / ${pressure_divider_ratio};
 
  - platform: template
    name: "Boiler System Pressure (fast)"
    id: boiler_system_pressure_fast
    entity_category: diagnostic
    unit_of_measurement: "bar"
    accuracy_decimals: 2
    update_interval: 2s
    lambda: |-
      if (!id(boiler_system_pressure_raw).has_state())
        return {};
      float v_sensor = id(boiler_system_pressure_raw).state / ${pressure_divider_ratio};
      // Ratiometric: scale the sensor output to a 5 V supply, then apply 0.5-4.5 V = 0-full scale
      float v_norm = v_sensor * (5.0 / ${pressure_supply_v});
      float pressure = (v_norm - 0.5) * (${pressure_full_scale_bar} / 4.0);
      if (pressure < 0) pressure = 0;
      return pressure;
    filters:
      - calibrate_linear:
          method: least_squares
          datapoints:
            - 1.00 -> 1.10
            - 1.42 -> 1.60
            - 1.46 -> 1.65
      - clamp:
          min_value: 0
 
