# =============================================================================
# esp32-control-room-heating.yaml - boiler plant monitoring (10 Nov 2026: off-board rewiring)
# ESP32-S3-DevKitC-1 (16 MB), ESPHome, ESP-IDF
#   - Boiler flow/return NTCs: installed, 3.3k dividers (docs/02)
#   - Boiler pressure: installed, calibrated to the boiler gauge, fast + 1-min main (docs/04)
#   - Cylinder outlet NTCs: left installed, right wired (docs/05)
#   - Tundish plates: commissioned, wet + running two-sensitivity sensing (docs/05)
#   - Current clamp (GPIO3): cable run to the electrical enclosure, to wire (docs/03)
#   - Pressure gauges (10 Nov 2026 rewire): dividers (10k/20k) + 100 nF now in each GAUGE's junction
#     box; signal cores land directly on: boiler GPIO6, left cylinder GPIO2, right cylinder GPIO1.
#     5 V / GND via the bus strip (470 uF across the buses to be added).
#   - Off-board NTC wiring: IO4/IO5 3.3k to 3V3 pins; IO8/IO9 3.3k to IO10, a 3V3 POST (keep IO10
#     out of this YAML). IO13 stays the current clamp's post.
#   - Tundish plates re-terminated 10 Nov: LEFT plate B on IO38 (sense GPIO39), RIGHT plate B on IO47
#     (sense GPIO20), so the pins below are swapped vs 5 Nov. Confirm with a water test.
#   - Opto board, 8 inputs (IN1-IN8): enclosure fitted, cables run, to wire (docs/11)
# =============================================================================
substitutions:
  # Boiler pressure transducer: generic G1/4" 0-80 PSI, 0.5-4.5 V, ratiometric (assumed)
  pressure_full_scale_bar: "5.516"    # 80 PSI
  pressure_supply_v: "4.69"           # measured at the sensor's red wire (ESP32 5V pin)
  pressure_divider_ratio: "0.664"     # measured: GPIO1 0.760 V / sensor 1.145 V
  # Cylinder cold-inlet transducers: Ausla 0-150 PSI (10.342 bar), 0.5-4.5 V, 5 V ratiometric.
  # Divider 10k/20k (in each gauge's box): nominal ratio 0.667 until measured (pin V / sensor V).
  # Zero: the sensor's output at ROOM pressure, normalised to 5 V. Nominal 0.5 V; replace with
  # "Inlet (Left/Right) Sensor Voltage Normalised" read at room pressure before the plumber fits them.
  inlet_full_scale_bar: "10.342"
  inlet_left_divider_ratio: "0.667"
  inlet_right_divider_ratio: "0.667"
  inlet_left_zero_v: "0.487"     # 11 Nov 2026: mean of 1.5 h at room pressure (0.47-0.50 swing)
  # Revisit both zeros once the 470 uF is fitted across the 5 V and GND buses.
  inlet_right_zero_v: "0.482"    # 11 Nov 2026: mean of 1.5 h at room pressure (0.468-0.496 swing)

esphome:
  name: esp32-control-room-heating
  friendly_name: Control Room (Heating)
  on_boot:
    priority: 600
    then:
      - lambda: |-
          // Tundish gate posts: inputs, no internal pull, until each "running" sample
          gpio_set_direction(GPIO_NUM_47, GPIO_MODE_INPUT);
          gpio_set_pull_mode(GPIO_NUM_47, GPIO_FLOATING);
          gpio_set_direction(GPIO_NUM_38, GPIO_MODE_INPUT);
          gpio_set_pull_mode(GPIO_NUM_38, GPIO_FLOATING);
          // IO40 (JTAG MTDO pad, linked to the right MOSFET's gate): explicitly input, no pull
          gpio_set_direction(GPIO_NUM_40, GPIO_MODE_INPUT);
          gpio_set_pull_mode(GPIO_NUM_40, GPIO_FLOATING);

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  hardware_uart: UART0
  deassert_rts_dtr: true
  level: INFO

api:
  encryption:
    key: !secret esp32_control_room_heating_key
  custom_services: true
  homeassistant_services: true

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ESP32 Control Room Hotspot
    password: !secret fallback_ap_password

captive_portal:

debug:
  update_interval: 10s

globals:
  - id: was_calling
    type: bool
    initial_value: 'false'
  - id: overrun_start_time
    type: uint32_t
    initial_value: '0'
  - id: elevated_start_time
    type: uint32_t
    initial_value: '0'
  - id: last_real_cycle_time
    type: uint32_t
    initial_value: '0'
  - id: firing_latched
    type: bool
    initial_value: 'false'
  # --- Tundish: wet (any water, 2.2 MOhm only) ---
  - id: t1_streak
    type: int
    initial_value: '0'
  - id: t2_streak
    type: int
    initial_value: '0'
  - id: t1_events
    type: int
    restore_value: true
    initial_value: '0'
  - id: t2_events
    type: int
    restore_value: true
    initial_value: '0'
  # --- Tundish: running (internal ~45 kOhm pull-down added) ---
  - id: t1_run_streak
    type: int
    initial_value: '0'
  - id: t2_run_streak
    type: int
    initial_value: '0'
  - id: t1_run_events
    type: int
    restore_value: true
    initial_value: '0'
  - id: t2_run_events
    type: int
    restore_value: true
    initial_value: '0'
  # --- Tundish: raw readings within one sample ---
  - id: t1_raw_wet
    type: bool
    initial_value: 'false'
  - id: t2_raw_wet
    type: bool
    initial_value: 'false'

# =========================================================
# Tundish drip sensors — gold-plated contact plates + 2N7000 MOSFETs (as-built 5 Nov 2026)
# Plate power (both plates, shared): GPIO21, pulsed 150 ms every 5 s.
# 10 Nov 2026 re-termination (plates swapped vs 5 Nov):
# t1 = LEFT:  plate B on post IO38 (+ link to IO40, 2.2 MOhm to GND); 2N7000 S -> IO41 (-> GND),
#             G -> IO40, D -> GPIO39
# t2 = RIGHT: plate B on post IO47 (+ gate wire to IO19, 2.2 MOhm to GND); 2N7000 S -> GND,
#             G -> IO19, D -> GPIO20
# GPIO20 is also native USB D+: use only the board's UART ("COM") port.
# Two-sensitivity sensing: reading 1 (2.2 MOhm) = wet; reading 2 with the gate posts'
# internal ~45 kOhm pull-downs = running. Posts are only ever inputs.
# Test switches (OFF after reboot, and auto-off after 15 min so they can't be left on):
#   Test Mode: plate power held on, sampling paused (both tundishes).
#   Test Pull-down: gate posts' internal pull-downs on demand.
# Commissioning 6 Nov 2026 (meter 10 MOhm, DC):
#   Right IO38 dry 906 mV -> drain-low test showed drain-to-gate leakage -> new 2N7000
#     328 mV -> IPA clean of terminals 38-41 -> 30 mV (3 mV fully dry). Wet flowing 3.1-3.2 V;
#     pull-down on 2.2 V (running).
#   Left IO47 dry 0.3-0.4 V: board ruled out (ferrule out of IO47 401 mV; drain low with
#     IO20 verified 0 V no change; IO48/IO21 0 V; new 2N7000; MOSFET removed 415 mV), so
#     source is the cable/plate side (likely a small galvanic/leakage voltage). Within
#     margin (switching ~2 V). Wet flowing ~3.05-3.3 V; pull-down on 2.6 V flowing,
#     1.8 V drying. Record baselines at each periodic plate clean.
#   Wet = drips (relief valve weeping, warning); Running = sustained flow (discharge, critical).
# Posts on this board (never use elsewhere): IO2, IO13, IO41; IO38/IO40/IO47 lambdas only.
# =========================================================
switch:
  - platform: gpio
    pin: GPIO21
    id: plate_power
    internal: true
    restore_mode: ALWAYS_OFF

  - platform: template
    name: "Tundish Test Mode"
    id: tundish_test_mode
    entity_category: config
    icon: mdi:test-tube
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - switch.turn_on: plate_power
      - script.execute: tundish_test_mode_timer
    turn_off_action:
      - script.stop: tundish_test_mode_timer
      - switch.turn_off: tundish_test_pulldown
      - switch.turn_off: plate_power

  - platform: template
    name: "Tundish Test Pull-down"
    id: tundish_test_pulldown
    entity_category: config
    icon: mdi:arrow-down-bold-box-outline
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: |-
          gpio_set_pull_mode(GPIO_NUM_47, GPIO_PULLDOWN_ONLY);
          gpio_set_pull_mode(GPIO_NUM_38, GPIO_PULLDOWN_ONLY);
      - script.execute: tundish_test_pulldown_timer
    turn_off_action:
      - script.stop: tundish_test_pulldown_timer
      - lambda: |-
          gpio_set_pull_mode(GPIO_NUM_47, GPIO_FLOATING);
          gpio_set_pull_mode(GPIO_NUM_38, GPIO_FLOATING);

# Auto-off for the tundish test switches (15 min); restart mode re-arms on each switch-on
script:
  - id: tundish_test_mode_timer
    mode: restart
    then:
      - delay: 15min
      - switch.turn_off: tundish_test_mode
  - id: tundish_test_pulldown_timer
    mode: restart
    then:
      - delay: 15min
      - switch.turn_off: tundish_test_pulldown

sensor:
  # Flow / return NTCs (beta 3977): 3V3 -> 3.3k -> IO4 (flow) / IO5 (return) -> NTC -> GND
  # (swapped 10 Nov 2026 to match the off-board re-wiring: flow now GPIO4, return GPIO5)
  # (330k found fitted by mistake and replaced, 3 Nov 2026; IO4/IO5 swapped in YAML to match)
  - platform: adc
    pin: GPIO4
    id: boiler_flow_adc
    attenuation: 12db
    samples: 16
    update_interval: 2s

  - platform: resistance
    id: boiler_flow_ohm
    sensor: boiler_flow_adc
    configuration: DOWNSTREAM
    resistor: 3.3kOhm

  - platform: ntc
    sensor: boiler_flow_ohm
    name: "Boiler Flow Temperature"
    id: boiler_flow_temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    calibration:
      b_constant: 3977
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    filters:
      - median:
          window_size: 3
          send_every: 1
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1

  - platform: adc
    pin: GPIO5
    id: boiler_return_adc
    attenuation: 12db
    samples: 16
    update_interval: 2s

  - platform: resistance
    id: boiler_return_ohm
    sensor: boiler_return_adc
    configuration: DOWNSTREAM
    resistor: 3.3kOhm

  - platform: ntc
    sensor: boiler_return_ohm
    name: "Boiler Return Temperature"
    id: boiler_return_temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    calibration:
      b_constant: 3977
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    filters:
      - median:
          window_size: 3
          send_every: 1
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1

  - platform: template
    name: "Boiler ΔT (Flow − Return)"
    id: boiler_delta_t
    unit_of_measurement: "K"
    accuracy_decimals: 1
    update_interval: 2s
    lambda: |-
      if (!id(boiler_flow_temperature).has_state() || !id(boiler_return_temperature).has_state())
        return {};
      return id(boiler_flow_temperature).state - id(boiler_return_temperature).state;

  # Cylinder hot-outlet NTCs: 3V3 -> 3.3k -> IO8 (left, fitted) / IO9 (right, probe to fit) -> NTC -> GND
  - platform: adc
    pin: GPIO8
    id: cyl_left_outlet_adc
    attenuation: 12db
    samples: 16
    update_interval: 5s

  - platform: resistance
    id: cyl_left_outlet_ohm
    sensor: cyl_left_outlet_adc
    configuration: DOWNSTREAM
    resistor: 3.3kOhm

  - platform: ntc
    sensor: cyl_left_outlet_ohm
    name: "Hot Water Cylinder (Left) Outlet Temperature"
    id: cyl_left_outlet_temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    calibration:
      b_constant: 3977
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    filters:
      - median:
          window_size: 3
          send_every: 1
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1

  - platform: adc
    pin: GPIO9
    id: cyl_right_outlet_adc
    attenuation: 12db
    samples: 16
    update_interval: 5s

  - platform: resistance
    id: cyl_right_outlet_ohm
    sensor: cyl_right_outlet_adc
    configuration: DOWNSTREAM
    resistor: 3.3kOhm

  - platform: ntc
    sensor: cyl_right_outlet_ohm
    name: "Hot Water Cylinder (Right) Outlet Temperature"
    id: cyl_right_outlet_temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    calibration:
      b_constant: 3977
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    filters:
      - median:
          window_size: 3
          send_every: 1
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1

  # Boiler current clamp — SCT013-015 (15A = 1V RMS): 3V3 -> 10k -> IO3 -> 10k -> GND bias,
  # capacitor + on IO3, - on post IO13; clamp tip -> IO13, sleeve -> GND
  - platform: adc
    pin: GPIO3
    id: boiler_adc
    attenuation: 12db
    update_interval: never
    internal: true

  - platform: ct_clamp
    sensor: boiler_adc
    name: "Boiler Current"
    id: boiler_current
    sample_duration: 1000ms
    update_interval: 1s
    accuracy_decimals: 2
    filters:
      - multiply: 15.0   # 1V RMS = 15A. Refine with calibrate_linear against a known load.

  # Boiler pressure (10 Nov 2026): divider 10k/20k + 100 nF now in the boiler gauge's junction box;
  # its signal core lands on GPIO6. ADC calibration below was measured on GPIO1: re-check on GPIO6.
  # ADC calibrated against a meter; pressure calibrated to the boiler gauge (3 points, 3-4 Nov):
  # gauge = 1.193 x HA - 0.093 (valid 1.0-1.65 bar). Fast (diagnostic) + 1-min main sensor.
  # Cable screen to GND at the ESP32 end (5 Nov). TODO: 10 uF (+100 nF) at the sensor end.
  - platform: adc
    pin: GPIO6
    id: boiler_system_pressure_raw
    name: "Boiler Pressure Pin Voltage"
    entity_category: diagnostic
    unit_of_measurement: "V"
    accuracy_decimals: 3
    attenuation: 12db
    samples: 16
    update_interval: 1s
    filters:
      - median:
          window_size: 7
          send_every: 1
      - calibrate_linear:
          - 0.746 -> 0.760
          - 0.952 -> 0.958
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

  - platform: template
    name: "Boiler Pressure Sensor Voltage"
    id: boiler_pressure_sensor_voltage
    entity_category: diagnostic
    unit_of_measurement: "V"
    accuracy_decimals: 3
    update_interval: 10s
    lambda: |-
      if (!id(boiler_system_pressure_raw).has_state())
        return {};
      return id(boiler_system_pressure_raw).state / ${pressure_divider_ratio};

  - platform: template
    name: "Boiler System Pressure (fast)"
    id: boiler_system_pressure_fast
    entity_category: diagnostic
    unit_of_measurement: "bar"
    accuracy_decimals: 2
    update_interval: 2s
    lambda: |-
      if (!id(boiler_system_pressure_raw).has_state())
        return {};
      float v_sensor = id(boiler_system_pressure_raw).state / ${pressure_divider_ratio};
      // Ratiometric: scale the sensor output to a 5 V supply, then apply 0.5-4.5 V = 0-full scale
      float v_norm = v_sensor * (5.0 / ${pressure_supply_v});
      float pressure = (v_norm - 0.5) * (${pressure_full_scale_bar} / 4.0);
      if (pressure < 0) pressure = 0;
      return pressure;
    filters:
      - calibrate_linear:
          method: least_squares
          datapoints:
            - 1.00 -> 1.10
            - 1.42 -> 1.60
            - 1.46 -> 1.65
      - clamp:
          min_value: 0

  # Main pressure: 1 min average of the fast sensor (30 x 2 s), every 10 s. entity_category ""
  # overrides the diagnostic category the copy platform would inherit.
  - platform: copy
    source_id: boiler_system_pressure_fast
    name: "Boiler System Pressure"
    id: boiler_system_pressure
    entity_category: ""
    unit_of_measurement: "bar"
    accuracy_decimals: 2
    filters:
      - sliding_window_moving_average:
          window_size: 30
          send_every: 5

  # =========================================================
  # Cylinder cold-inlet pressures (Ausla 0-150 PSI), 10 Nov 2026 layout:
  #   at each gauge: 10k series + 20k + 100 nF to GND (divider and filter in the gauge's box);
  #   cable: brown 5 V (bus), blue signal (straight to the GPIO), braid GND (bus).
  #   LEFT -> GPIO2, RIGHT -> GPIO1. Zero both at room pressure (substitutions above).
  # Same filtering as the boiler sensor: fast (diagnostic, ~5-8 s) + 1-min main.
  # =========================================================
  - platform: adc
    pin: GPIO2
    id: inlet_left_pin_v
    name: "Inlet (Left) Pressure Pin Voltage"
    entity_category: diagnostic
    unit_of_measurement: "V"
    accuracy_decimals: 3
    attenuation: 12db
    samples: 16
    update_interval: 1s
    filters:
      - median:
          window_size: 7
          send_every: 1
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

  - platform: template
    name: "Inlet (Left) Sensor Voltage Normalised"
    id: inlet_left_v_norm
    entity_category: diagnostic
    unit_of_measurement: "V"
    accuracy_decimals: 3
    update_interval: 10s
    lambda: |-
      if (!id(inlet_left_pin_v).has_state()) return {};
      return (id(inlet_left_pin_v).state / ${inlet_left_divider_ratio}) * (5.0 / ${pressure_supply_v});

  - platform: template
    name: "Cylinder Left Inlet Pressure (fast)"
    id: inlet_left_pressure_fast
    entity_category: diagnostic
    unit_of_measurement: "bar"
    accuracy_decimals: 2
    update_interval: 2s
    lambda: |-
      if (!id(inlet_left_pin_v).has_state()) return {};
      float v_norm = (id(inlet_left_pin_v).state / ${inlet_left_divider_ratio}) * (5.0 / ${pressure_supply_v});
      float p = (v_norm - ${inlet_left_zero_v}) * (${inlet_full_scale_bar} / 4.0);
      return p < 0 ? 0.0f : p;

  - platform: copy
    source_id: inlet_left_pressure_fast
    name: "Cylinder Left Inlet Pressure"
    id: inlet_left_pressure
    entity_category: ""
    unit_of_measurement: "bar"
    accuracy_decimals: 2
    filters:
      - sliding_window_moving_average:
          window_size: 30
          send_every: 5

  - platform: adc
    pin: GPIO1
    id: inlet_right_pin_v
    name: "Inlet (Right) Pressure Pin Voltage"
    entity_category: diagnostic
    unit_of_measurement: "V"
    accuracy_decimals: 3
    attenuation: 12db
    samples: 16
    update_interval: 1s
    filters:
      - median:
          window_size: 7
          send_every: 1
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

  - platform: template
    name: "Inlet (Right) Sensor Voltage Normalised"
    id: inlet_right_v_norm
    entity_category: diagnostic
    unit_of_measurement: "V"
    accuracy_decimals: 3
    update_interval: 10s
    lambda: |-
      if (!id(inlet_right_pin_v).has_state()) return {};
      return (id(inlet_right_pin_v).state / ${inlet_right_divider_ratio}) * (5.0 / ${pressure_supply_v});

  - platform: template
    name: "Cylinder Right Inlet Pressure (fast)"
    id: inlet_right_pressure_fast
    entity_category: diagnostic
    unit_of_measurement: "bar"
    accuracy_decimals: 2
    update_interval: 2s
    lambda: |-
      if (!id(inlet_right_pin_v).has_state()) return {};
      float v_norm = (id(inlet_right_pin_v).state / ${inlet_right_divider_ratio}) * (5.0 / ${pressure_supply_v});
      float p = (v_norm - ${inlet_right_zero_v}) * (${inlet_full_scale_bar} / 4.0);
      return p < 0 ? 0.0f : p;

  - platform: copy
    source_id: inlet_right_pressure_fast
    name: "Cylinder Right Inlet Pressure"
    id: inlet_right_pressure
    entity_category: ""
    unit_of_measurement: "bar"
    accuracy_decimals: 2
    filters:
      - sliding_window_moving_average:
          window_size: 30
          send_every: 5

  # Tundish counters: wet events (dry -> wet) and discharge events (dry -> running)
  - platform: template
    name: "Tundish (Left) Wet Events"
    lambda: 'return (float) id(t1_events);'
    accuracy_decimals: 0
    update_interval: 60s
  - platform: template
    name: "Tundish (Right) Wet Events"
    lambda: 'return (float) id(t2_events);'
    accuracy_decimals: 0
    update_interval: 60s
  - platform: template
    name: "Tundish (Left) Discharge Events"
    lambda: 'return (float) id(t1_run_events);'
    accuracy_decimals: 0
    update_interval: 60s
  - platform: template
    name: "Tundish (Right) Discharge Events"
    lambda: 'return (float) id(t2_run_events);'
    accuracy_decimals: 0
    update_interval: 60s

  - platform: wifi_signal
    name: "Control Room WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Control Room Uptime"

  - platform: debug
    free:
      name: "Control Room Heap Free"
    block:
      name: "Control Room Heap Max Block"
    loop_time:
      name: "Control Room Loop Time"

text_sensor:
  # =========================================================
  # Boiler Electrical State from the SCT013-015 clamp (single pass on the boiler's
  # permanent live, 7 Nov 2026). Measured on this Ideal Logic+ S30:
  #   standby: ~0 A (below resolution with one pass), pump only (overrun): ~0.27-0.29 A,
  #   fan/ignition: ~0.44 A, firing: ~0.38-0.59 A (modulating; ~0.58 A at full rate),
  #   pump overrun: ~4 min.
  # Firing uses hysteresis: starts at >= 0.42 A, ends only below 0.33 A, so the burner
  # modulating down is not counted as a new start. High = >= 0.55 A (full rate).
  # Pre-Purge / Overrun need IN1 (boiler call, opto board) and Idle needs more clamp
  # turns: both to follow. Until IN1 is wired, "Firing Without Call" reads on while firing.
  # =========================================================
  - platform: template
    name: "Boiler Electrical State"
    id: boiler_electrical_state
    update_interval: 1s
    lambda: |-
      if (!id(boiler_current).has_state())
        return {"Unknown"};
      float a = id(boiler_current).state;
      bool calling = id(boiler_call_for_heat).state;
      uint32_t now = millis();

      // Off / standby (standby is below resolution with a single clamp pass)
      if (a < 0.10) {
        id(firing_latched) = false;
        id(elevated_start_time) = 0;
        id(was_calling) = false;
        return {"Off"};
      }

      // Firing with hysteresis
      if (!id(firing_latched) && a >= 0.42) {
        id(firing_latched) = true;
        id(elevated_start_time) = now;
      } else if (id(firing_latched) && a < 0.33) {
        id(firing_latched) = false;
        id(elevated_start_time) = 0;
      }

      if (id(firing_latched)) {
        id(was_calling) = calling;
        id(overrun_start_time) = 0;
        id(last_real_cycle_time) = now;
        if (now - id(elevated_start_time) < 10000)
          return {"Ignition Attempt"};
        if (a >= 0.55)
          return {"Firing (Running) - High"};
        return {"Firing (Running) - Low"};
      }

      // Not firing, current 0.10-0.42 A: pump and/or fan
      if (a < 0.15) {
        if (calling && !id(was_calling)) {
          id(was_calling) = true;
          return {"Pre-Purge"};
        }
        return {"Idle"};
      }

      // Pump band (~0.15-0.42 A)
      if (!calling && id(was_calling)) {
        if (id(overrun_start_time) == 0) id(overrun_start_time) = now;
        if (now - id(overrun_start_time) < 300000)   // up to 5 min (measured ~4 min)
          return {"Overrun"};
        id(was_calling) = false;
        id(overrun_start_time) = 0;
      }
      if (!calling && id(last_real_cycle_time) > 0) {
        uint32_t hours_since = (now - id(last_real_cycle_time)) / 3600000;
        if (hours_since >= 23 && hours_since <= 25)
          return {"24h Pump Self-Test (likely)"};
      }
      return {"Fan and/or Pump Active"};

binary_sensor:
  - platform: status
    name: "Control Room Online"

  # =========================================================
  # Opto board: Hailege 8-ch AC 230 V optocoupler, logic link set to 3.3 V (docs/11).
  # Board outputs -> GPIO (internal pull-ups). Output LOW when 230 V present, so
  # inverted: true is EXPECTED - confirm each channel against a real demand.
  #   IN1 Boiler call (W7)              -> GPIO14
  #   IN2 Hot water timer output (W3)   -> GPIO18
  #   IN3 HW relay L output (W6)        -> GPIO15
  #   IN4 HW relay R output (W5)        -> GPIO16
  #   IN5 Cyl L valve drive (W2)        -> GPIO17
  #   IN6 Cyl R valve drive (W1)        -> GPIO11
  #   IN7 UFH relay / UF valve (W4)     -> GPIO12
  #   IN8 Radiator relay (W8)           -> GPIO42  (live only after the TF/MF re-wire)
  # GPIO6/7 freed (spare ADC1). Avoid GPIO19 (USB), 0/45/46, 35-37, 48.
  # =========================================================
  - platform: gpio
    pin:
      number: GPIO14
      mode: INPUT_PULLUP
      inverted: true
    name: "Opto IN1 Boiler Call"
    id: boiler_call_for_heat
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
  - platform: gpio
    pin:
      number: GPIO18
      mode: INPUT_PULLUP
      inverted: true
    name: "Opto IN2 Hot Water Timer"
    id: opto_in2_hw_timer
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
  - platform: gpio
    pin:
      number: GPIO15
      mode: INPUT_PULLUP
      inverted: true
    name: "Opto IN3 HW Relay Left"
    id: opto_in3_hw_relay_left
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
  - platform: gpio
    pin:
      number: GPIO16
      mode: INPUT_PULLUP
      inverted: true
    name: "Opto IN4 HW Relay Right"
    id: opto_in4_hw_relay_right
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
  - platform: gpio
    pin:
      number: GPIO17
      mode: INPUT_PULLUP
      inverted: true
    name: "Opto IN5 Cylinder Left Valve Drive"
    id: opto_in5_cyl_left_valve
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
  - platform: gpio
    pin:
      number: GPIO11
      mode: INPUT_PULLUP
      inverted: true
    name: "Opto IN6 Cylinder Right Valve Drive"
    id: opto_in6_cyl_right_valve
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
  - platform: gpio
    pin:
      number: GPIO12
      mode: INPUT_PULLUP
      inverted: true
    name: "Opto IN7 UFH Relay"
    id: opto_in7_ufh_relay
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
  - platform: gpio
    pin:
      number: GPIO42
      mode: INPUT_PULLUP
      inverted: true
    name: "Opto IN8 Radiator Relay"
    id: opto_in8_radiator_relay
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms

  - platform: template
    name: "Boiler State - Off"
    id: state_off
    lambda: |-
      return id(boiler_electrical_state).state == "Off";
  - platform: template
    name: "Boiler State - Idle"
    id: state_idle
    lambda: |-
      return id(boiler_electrical_state).state == "Idle";
  - platform: template
    name: "Boiler State - Fan and/or Pump Active"
    id: state_fan_pump_active
    lambda: |-
      return id(boiler_electrical_state).state == "Fan and/or Pump Active";
  - platform: template
    name: "Boiler State - 24h Pump Self-Test"
    id: state_24h_self_test
    lambda: |-
      return id(boiler_electrical_state).state == "24h Pump Self-Test (likely)";
  - platform: template
    name: "Boiler State - Pre-Purge"
    id: state_pre_purge
    lambda: |-
      return id(boiler_electrical_state).state == "Pre-Purge";
  - platform: template
    name: "Boiler State - Ignition Attempt"
    id: state_ignition_attempt
    lambda: |-
      return id(boiler_electrical_state).state == "Ignition Attempt";
  - platform: template
    name: "Boiler State - Firing (Running) - Low"
    id: state_firing_low
    lambda: |-
      return id(boiler_electrical_state).state == "Firing (Running) - Low";
  - platform: template
    name: "Boiler State - Firing (Running) - High"
    id: state_firing_high
    lambda: |-
      return id(boiler_electrical_state).state == "Firing (Running) - High";
  - platform: template
    name: "Boiler State - Overrun"
    id: state_overrun
    lambda: |-
      return id(boiler_electrical_state).state == "Overrun";
  - platform: template
    name: "Firing Without Call"
    id: firing_without_call
    lambda: |-
      std::string s = id(boiler_electrical_state).state;
      return (s == "Ignition Attempt" || s == "Firing (Running) - Low" || s == "Firing (Running) - High")
             && !id(boiler_call_for_heat).state;

  # Tundish sense pins (MOSFET drains): configured here for their pull-ups; the interval
  # lambda reads them directly within each plate pulse.
  - platform: gpio
    pin:
      number: GPIO39      # t1 = LEFT: plate B on IO38 -> MOSFET (gate IO40) -> drain GPIO39
      mode: INPUT_PULLUP
      inverted: true
    id: t1_sense
    internal: true
  - platform: gpio
    pin:
      number: GPIO20      # t2 = RIGHT: plate B on IO47 -> MOSFET (gate IO19) -> drain GPIO20
      mode: INPUT_PULLUP
      inverted: true
    id: t2_sense
    internal: true

  - platform: template
    name: "Tundish (Left) Wet"
    id: t1_wet
    device_class: moisture
  - platform: template
    name: "Tundish (Right) Wet"
    id: t2_wet
    device_class: moisture
  - platform: template
    name: "Tundish Any Wet"
    id: any_wet
    device_class: moisture
    lambda: |-
      return id(t1_wet).state || id(t2_wet).state;
  - platform: template
    name: "Tundish (Left) Running"
    id: t1_running
    device_class: running
  - platform: template
    name: "Tundish (Right) Running"
    id: t2_running
    device_class: running
  - platform: template
    name: "Tundish Any Running"
    id: any_running
    device_class: running
    lambda: |-
      return id(t1_running).state || id(t2_running).state;

button:
  - platform: template
    name: "Reset Tundish Wet Events"
    on_press:
      - lambda: |-
          id(t1_events) = 0;
          id(t2_events) = 0;
          id(t1_run_events) = 0;
          id(t2_run_events) = 0;

interval:
  - interval: 5s
    then:
      - if:
          condition:
            switch.is_off: tundish_test_mode
          then:
            - lambda: |-
                gpio_set_pull_mode(GPIO_NUM_47, GPIO_FLOATING);
                gpio_set_pull_mode(GPIO_NUM_38, GPIO_FLOATING);
            - switch.turn_on: plate_power
            - delay: 150ms
            # Reading 1: 2.2 MOhm only -> "wet". Sense pin LOW = MOSFET on.
            - lambda: |-
                id(t1_raw_wet) = (gpio_get_level(GPIO_NUM_39) == 0);   // LEFT
                id(t2_raw_wet) = (gpio_get_level(GPIO_NUM_20) == 0);   // RIGHT
                gpio_set_pull_mode(GPIO_NUM_47, GPIO_PULLDOWN_ONLY);
                gpio_set_pull_mode(GPIO_NUM_38, GPIO_PULLDOWN_ONLY);
            - delay: 20ms
            # Reading 2: with the internal pull-downs -> "running"
            - lambda: |-
                bool t1_run_raw = (gpio_get_level(GPIO_NUM_39) == 0);  // LEFT
                bool t2_run_raw = (gpio_get_level(GPIO_NUM_20) == 0);  // RIGHT
                gpio_set_pull_mode(GPIO_NUM_47, GPIO_FLOATING);
                gpio_set_pull_mode(GPIO_NUM_38, GPIO_FLOATING);

                if (id(t1_raw_wet)) { id(t1_streak)++; } else { id(t1_streak) = 0; }
                bool wet1 = id(t1_streak) >= 2;
                if (wet1 && !id(t1_wet).state) { id(t1_events)++; }
                id(t1_wet).publish_state(wet1);

                if (id(t2_raw_wet)) { id(t2_streak)++; } else { id(t2_streak) = 0; }
                bool wet2 = id(t2_streak) >= 2;
                if (wet2 && !id(t2_wet).state) { id(t2_events)++; }
                id(t2_wet).publish_state(wet2);

                if (t1_run_raw) { id(t1_run_streak)++; } else { id(t1_run_streak) = 0; }
                bool run1 = id(t1_run_streak) >= 2;
                if (run1 && !id(t1_running).state) { id(t1_run_events)++; }
                id(t1_running).publish_state(run1);

                if (t2_run_raw) { id(t2_run_streak)++; } else { id(t2_run_streak) = 0; }
                bool run2 = id(t2_run_streak) >= 2;
                if (run2 && !id(t2_running).state) { id(t2_run_events)++; }
                id(t2_running).publish_state(run2);
            - if:
                condition:
                  switch.is_off: tundish_test_mode
                then:
                  - switch.turn_off: plate_power
